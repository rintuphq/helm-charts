{{- if .Values.clusterAgent.enabled }}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rintup-agent.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rintup-agent.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- if .Values.rbac.create }}
---
# get/list/watch only, on explicitly listed resources. No Secrets, ConfigMaps, exec/log/proxy; no write access.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "rintup-agent.fullname" . }}-cluster-agent
  labels:
    {{- include "rintup-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "events", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "rintup-agent.fullname" . }}-cluster-agent
  labels:
    {{- include "rintup-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "rintup-agent.fullname" . }}-cluster-agent
subjects:
  - kind: ServiceAccount
    name: {{ include "rintup-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Leader election: get/update only on the Lease this chart creates (templates/lease.yaml), only in this namespace.
# No create: Helm creates the Lease and deletes it on uninstall.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "rintup-agent.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rintup-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: [{{ include "rintup-agent.leaseName" . | quote }}]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "rintup-agent.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rintup-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "rintup-agent.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "rintup-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
