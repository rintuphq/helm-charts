{{- if .Values.nodeAgent.enabled }}
{{- $na := .Values.nodeAgent }}
# Node agent: host /proc (and optionally the root file system) is mounted READ-ONLY. hostNetwork/hostPID/hostIPC are off,
# no Kubernetes API access (no service account token is mounted). Because of hostPath the namespace Pod Security level
# must be "privileged" (baseline does not allow hostPath; see README "Security").
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "rintup-agent.fullname" . }}-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rintup-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: node-agent
spec:
  selector:
    matchLabels:
      {{- include "rintup-agent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: node-agent
  {{- with $na.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "rintup-agent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: node-agent
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      {{- with (default .Values.priorityClassName $na.priorityClassName) }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "rintup-agent.podSecurityContext" . | nindent 8 }}
      containers:
        - name: node-agent
          image: {{ include "rintup-agent.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "rintup-agent.containerSecurityContext" . | nindent 12 }}
          env:
            {{- include "rintup-agent.commonEnv" . | nindent 12 }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST_PROC
              value: /host/proc
            {{- if $na.mountHostRoot }}
            - name: HOST_ROOT
              value: /host/root
            {{- end }}
            - name: RINTUP_INTERVAL_SECONDS
              value: {{ $na.intervalSeconds | quote }}
            {{- with $na.processes }}
            - name: RINTUP_PROCESSES
              value: {{ join "," . | quote }}
            {{- end }}
          resources:
            {{- toYaml $na.resources | nindent 12 }}
          volumeMounts:
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            {{- if $na.mountHostRoot }}
            - name: host-root
              mountPath: /host/root
              readOnly: true
              mountPropagation: HostToContainer
            {{- end }}
      volumes:
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
        {{- if $na.mountHostRoot }}
        - name: host-root
          hostPath:
            path: /
            type: Directory
        {{- end }}
      {{- with $na.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $na.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $na.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
