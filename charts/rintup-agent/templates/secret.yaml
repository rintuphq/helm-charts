{{- include "rintup-agent.validate" . -}}
{{- if and .Values.apiKey (not .Values.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rintup-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rintup-agent.labels" . | nindent 4 }}
type: Opaque
data:
  apiKey: {{ .Values.apiKey | b64enc | quote }}
{{- end }}
